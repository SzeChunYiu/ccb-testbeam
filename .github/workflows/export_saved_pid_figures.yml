name: Export saved PID figures

on:
  pull_request:
    paths:
      - ".github/workflows/export_saved_pid_figures.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reports/paper_618_species_penetration_2m_20260814T1449Z/figures
            publication/figures/gated
          sparse-checkout-cone-mode: true
      - name: Collect PID DeltaE-E figures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          cp reports/paper_618_species_penetration_2m_20260814T1449Z/figures/618_data_amplitude_I_II.png export/
          cp reports/paper_618_species_penetration_2m_20260814T1449Z/figures/618_mc_truth_full_I.png export/
          cp reports/paper_618_species_penetration_2m_20260814T1449Z/figures/618_mc_truth_full_II.png export/
          cp reports/paper_618_species_penetration_2m_20260814T1449Z/figures/618_mc_truth_4layer_I.png export/
          cp reports/paper_618_species_penetration_2m_20260814T1449Z/figures/618_mc_truth_4layer_II.png export/
          cp publication/figures/gated/fig07_data_deltaE_E_per_sample.png export/
          sha256sum export/* | sort > export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: saved-pid-deltae-e-figures
          path: export
          if-no-files-found: error
          retention-days: 7
