    sample: sample_ii
    purpose: calibration
    acquisition_purpose: sample_ii_calibration_canonical
    evidence:
      - docs/02_data_and_runs.md
      - configs/s00_reproduction.yaml
  65: {sample: sample_ii, purpose: analysis, acquisition_purpose: light_collection_candidate}

decisions:
  sample_ii_calibration_run:
    canonical_run: 64
    rejected_run: 61
    evidence_rank:
      - newer_report_and_s00_config
      - docs/02_data_and_runs.md discrepancy note
    regeneration_required:
      - timing_templates
      - timewalk
      - qtemplate
    status: RESOLVED_WITH_EVIDENCE

