title: Canonical CCB beam-run ledger (Sample I/II roles)
status: ACCEPTED_FOR_SAMPLE_II_CALIBRATION_SPLIT
notes: >
  Resolves the Sample II calibration contradiction between the older 54-page
  B-stack timing note (run 61) and the newer report / configs/s00_reproduction.yaml
  (run 64). Evidence preference follows docs/02_data_and_runs.md: the repository
  adopts the newer report. Run 61 remains an analysis run, not calibration.

