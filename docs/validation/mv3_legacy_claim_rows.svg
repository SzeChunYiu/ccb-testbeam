<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
<title id="title">Legacy MV3 stopping-profile claim audit</title>
<desc id="desc">The fixed report shows rounded B8 fractions of 0.223 in MC and 0.023 in data, while exact counts and a decomposed chi-square statistic are absent. The current implementation uses fail-closed sample and per-layer inputs.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#444" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" font-family="sans-serif" font-size="24" font-weight="bold">Legacy MV3 v3: fixed rounded outputs, not an accepted closure</text>
<text x="30" y="66" font-family="sans-serif" font-size="14">Synthetic documentation/provenance visualization — not detector data.</text>
<text x="30" y="108" font-family="sans-serif" font-size="18" font-weight="bold">Reported B8 fractions</text>
<text x="30" y="156" font-family="sans-serif" font-size="15">MC</text>
<rect x="120" y="136" width="156.1" height="28" fill="url(#hatch)" stroke="black"/>
<text x="286.1" y="157" font-family="monospace" font-size="15">0.223</text>
<text x="30" y="206" font-family="sans-serif" font-size="15">Data</text>
<rect x="120" y="186" width="16.1" height="28" fill="#d9d9d9" stroke="black"/>
<text x="146.1" y="207" font-family="monospace" font-size="15">0.023</text>
<text x="30" y="250" font-family="sans-serif" font-size="13">MC exact numerator is unidentified: 55511–55759 are all compatible with 0.223 at 3 d.p.</text>
<text x="30" y="274" font-family="sans-serif" font-size="13">Data exact numerator is unidentified: 6902–7208 are all compatible with 0.023 at 3 d.p.</text>
<line x1="30" y1="304" x2="950" y2="304" stroke="black"/>
<text x="30" y="338" font-family="sans-serif" font-size="18" font-weight="bold">Goodness-of-fit label</text>
<text x="30" y="370" font-family="monospace" font-size="17">χ²/ndf = 68269.4</text>
<text x="300" y="370" font-family="sans-serif" font-size="14">χ², ndf, p-value, bin errors and covariance are not reported.</text>
<text x="30" y="410" font-family="sans-serif" font-size="18" font-weight="bold">Accepted software policy</text>
<text x="30" y="438" font-family="sans-serif" font-size="14">Require explicit sample_label + per-layer hit/energy masks; block instead of event-parity or stop_layer occupancy proxies.</text>
<text x="30" y="472" font-family="sans-serif" font-size="12">Status: VALIDATED; policy: LEGACY_MV3_PROFILE_REQUIRES_EXACT_COUNTS_AND_FAIL_CLOSED_RERUN</text>
</svg>
