name: S00c selector-count regression

on:
  pull_request:
    paths:
      - ".github/workflows/s00c-selector-count-regression.yml"
      - "configs/s00d_1781028640_1234_005956da_ci_premerge.json"
      - "configs/s00c_*.json"
      - "scripts/s00c*.py"
      - "scripts/s00d_1781028640_1234_005956da_ci_premerge.py"
      - "scripts/p04k_1781029246_839_554f50f7_selector_charge_closure.py"
      - "docs/02_data_and_runs.md"
      - "docs/09_open_questions.md"
      - "DATA.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/s00c-selector-count-regression.yml"
      - "configs/s00d_1781028640_1234_005956da_ci_premerge.json"
      - "configs/s00c_*.json"
      - "scripts/s00c*.py"
      - "scripts/s00d_1781028640_1234_005956da_ci_premerge.py"
      - "scripts/p04k_1781029246_839_554f50f7_selector_charge_closure.py"
      - "docs/02_data_and_runs.md"
      - "docs/09_open_questions.md"
      - "DATA.md"

jobs:
  s00c-selector-count:
    runs-on: self-hosted
    env:
      TESTBEAM_RAW_ROOT_DIR: /home/billy/ccb-data/extracted/root/root
    steps:
      - uses: actions/checkout@v4
      - name: Run S00c raw selector-count guard
        run: |
          /home/billy/anaconda3/bin/python scripts/s00d_1781028640_1234_005956da_ci_premerge.py --guard-only
      - name: Bootstrap raw PID Hugging Face discovery
        shell: bash
        run: |
          set -euo pipefail
          /home/billy/anaconda3/bin/python -m venv "$RUNNER_TEMP/ccb-pid-env"
          "$RUNNER_TEMP/ccb-pid-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ccb-pid-env/bin/python" -m pip install huggingface_hub pyarrow pandas
          "$RUNNER_TEMP/ccb-pid-env/bin/python" chatgpt_todo/raw_pid_20260907/discover_hf_raw.py
      - name: Report local raw B-stack ROOT inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "===CCB_LOCAL_RAW_INVENTORY_BEGIN==="
          find "$TESTBEAM_RAW_ROOT_DIR" -maxdepth 1 -type f -name 'hrdb_run_*.root' -printf '%f %s\n' | sort
          echo "===CCB_LOCAL_RAW_INVENTORY_END==="
