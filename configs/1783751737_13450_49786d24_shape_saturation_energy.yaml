abstract_text: "This study quantifies how waveform-shape distortion, ADC saturation, and pedestal treatment affect B-stave deposited-energy closure. It first reproduces the raw ROOT S00 selected-pulse number exactly, then compares pedestal-subtracted charge integration, a constrained GEANT4/Birks duplicate-readout template baseline, ridge regression, gradient-boosted trees, a tabular MLP, a 1D-CNN, and a new physics-residual MLP under the same run-blocked split. The target is duplicate odd-readout energy on a GEANT4-truth MeV scale, so the benchmark tests energy closure and response-model stability rather than event-matched GEANT4 truth. The held-out winner is **geant4_birks_lookup**, with res68=0.04024 and run-block bootstrap 95% CI [0.03888, 0.04173]."
model_panel_text: "All learned models use the same train/held-out split by run. Features are even-readout only: pedestal-subtracted waveform samples, per-stave amplitudes and charges, multiplicity, depth, saturation count, early/late charge fractions, and peak locations. Odd charges, event identifiers, and run labels are excluded from model inputs. The method panel is ridge regression, gradient-boosted trees, a tabular MLP, a 1D-CNN over the four B-stave waveform sequence, and a new physics-residual MLP that learns a multiplicative correction to the GEANT4/Birks baseline. This residual architecture is sensible here because it forces the neural network to explain only saturation/pedestal/shape deviations left by the physically constrained charge-to-energy model."
systematics_text: "Dominant systematics are the non-alignment of simulated and real events, the assumed mapping from HRD B staves to `Sci_bar_LayerID`, possible mismatch between simulated scintillator energy deposition and HRD light/electronics response, disabled or unvalidated optical/Birks response in the GEANT4 output, ADC saturation above the digitizer ceiling, drift in the four-sample pedestal estimator, and the use of duplicate-readout closure for real-data benchmarking. The absolute MeV scale is therefore truth-anchored but not a full detector-response simulation. The saturation and pedestal terms should be read as closure diagnostics under the raw HRDv preprocessing, not as a final detector calibration."
caveats_text: "Caveats: this closure target is duplicate odd-readout energy on a GEANT4-truth MeV scale, not event-matched simulated truth or an independently calibrated calorimeter energy. The learned models are deliberately constrained by run-blocked validation and excluded odd-charge/run/event inputs, so their lower scores should be interpreted as limits under leakage-safe closure rather than final architecture capacity. The bootstrap intervals resample held-out runs and cover run-to-run variation in this subset, but they do not include uncertainty from future optical transport, digitization, forced-pedestal, or saturation-injection calibrations."
finding: "The run-blocked comparison names **geant4_birks_lookup** as the lowest-res68 method in `result.json`. A method is considered physically credible only when its gain survives held-out runs and does not require odd charge, event identifiers, or run labels. The shape-conditioned residual model is interpreted as a diagnostic of saturation/pedestal response left after the constrained GEANT4/Birks baseline, not as proof that unconstrained waveform learning is a better detector model."
hypothesis: "A production energy estimator should retain the constrained pedestal-subtracted GEANT4/Birks charge model and add only a low-capacity residual correction after external optical-response validation. Future work should add forced/random pedestal runs and saturation-injection tests so saturation recovery can be separated from duplicate-readout closure."

