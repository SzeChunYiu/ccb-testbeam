      - {source: older_v41_bstack_timing_note, role: sample_ii_calibration, status: SUPERSEDED}
  62: {sample: sample_ii, purpose: analysis, acquisition_purpose: light_collection_candidate}
  63: {sample: sample_ii, purpose: analysis, acquisition_purpose: light_collection_candidate}
