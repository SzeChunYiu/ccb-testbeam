# CCB test-beam -- paper figure result registry
# ============================================================================
# Single source of truth binding every paper figure to its source artifact.
# Regenerated 2026-07-26 from the cluster A-D + Opticks + E synthesis programme
# (canonical claim state: reports/studies/clusterE/claims_table.csv +
# docs/claim_ledger.csv). No headline number is hand-entered: every quantitative
# entry points `result:` at the on-disk cluster metrics/counts JSON and reads its
# `value_key:`, and every `source_figure:` is a real PNG on origin/main.
#
# Build with:
#     python -m tools.figure_registry.builder --registry paper/figures.yaml --out paper/figures
#
# Statuses (allowed):
#   VALIDATED            data result + MC/truth or independent closure supports it
#   PRELIMINARY          source-backed but not paper-authorizing without opt-in
#   SIMULATION_RESULT    proven on Monte Carlo only (cluster MC closure)
#   MC_METHOD_CLOSURE    analysis-chain closure on MC (strongest SIMULATION_RESULT)
#   PARTIAL              proven up to a defined last-mile gap (e.g. Opticks gather)
#   GATED                candidate withheld until a named control passes
#   TENSION              data/MC comparison disagrees beyond tolerance
#   BLOCKED              canonical value withheld pending a named criterion
#   BLOCKED_DATA         underlying beam data not staged (no figure can be built)
#   SUPERSEDED           retained only as correction history; do not use
#   EXTERNAL_BLOCKER     result artifact compute-blocked / not on disk -> BLOCKED
#   ILLUSTRATIVE         schematic only; carries no measured numbers
#
# Rules:
#   - Quantitative figures read `value_key` from `result` (a cluster metrics JSON)
#     ONLY (never a hand-entered literal).
#   - figure_sourced entries: the rendered PNG / REPORT is the primary artifact (no
#     single metrics JSON to read); the caption quotes claims_table.csv directly.
#   - BLOCKED_DATA / EXTERNAL_BLOCKER entries carry NO headline number and are
#     reported BLOCKED by the builder until the underlying data/artifact is staged.
#   - claim_id / evidence_class mirror reports/studies/clusterE/claims_table.csv.
# ----------------------------------------------------------------------------

