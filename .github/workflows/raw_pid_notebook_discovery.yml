name: Raw PID notebook rerun

on:
  pull_request:
    paths:
      - ".github/workflows/raw_pid_notebook_discovery.yml"
      - "chatgpt_todo/raw_pid_20260907/**"

permissions:
  contents: read

jobs:
  raw-pid-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            chatgpt_todo/raw_pid_20260907
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow matplotlib scikit-learn requests huggingface_hub nbformat nbconvert ipykernel
      - name: Assemble, apply audited bookkeeping fixes, and syntax-check analysis sources
        shell: bash
        run: |
          set -euo pipefail
          cat chatgpt_todo/raw_pid_20260907/parts/raw_pid_part_*.pyfrag > chatgpt_todo/raw_pid_20260907/raw_pid_analysis.py
          cat chatgpt_todo/raw_pid_20260907/parts/notebook_part_*.pyfrag > chatgpt_todo/raw_pid_20260907/build_raw_pid_notebook.py
          python - <<'PY'
          from pathlib import Path
          p = Path("chatgpt_todo/raw_pid_20260907/raw_pid_analysis.py")
          s = p.read_text(encoding="utf-8")
          old = 'if parity == "1/3/5/7" and energy_mode == "E4" and fs in ["dee", "four_readouts"]:'
          new = 'if parity == "1/3/5/7" and energy_mode == "E4":'
          if old not in s:
              raise SystemExit("expected OOF bookkeeping target not found")
          s = s.replace(old, new, 1)

          old = '    selected["mc_shape_d_score"] = clf.predict_proba(Xd)[:, 1]\n'
          new = ('    selected["rank_E_pooled"] = Xd[:, 0]\n'
                 '    selected["rank_dE_pooled"] = Xd[:, 1]\n'
                 '    selected["mc_shape_d_score"] = clf.predict_proba(Xd)[:, 1]\n')
          if old not in s:
              raise SystemExit("expected pooled-rank storage target not found")
          s = s.replace(old, new, 1)

          old = ('        ux = _rank_u(q["E_adc"].to_numpy())\n'
                 '        uy = _rank_u(q["deltaE_adc"].to_numpy())\n')
          new = ('        ux = q["rank_E_pooled"].to_numpy(dtype=float)\n'
                 '        uy = q["rank_dE_pooled"].to_numpy(dtype=float)\n')
          if old not in s:
              raise SystemExit("expected rank-plot target not found")
          s = s.replace(old, new, 1)

          old = ('        ax.set_xlabel("rank(E_ADC) within selected sample")\n'
                 '        ax.set_ylabel("rank(ΔE_ADC) within selected sample")\n')
          new = ('        ax.set_xlabel("pooled-data rank(E_ADC)")\n'
                 '        ax.set_ylabel("pooled-data rank(ΔE_ADC)")\n')
          if old not in s:
              raise SystemExit("expected rank-axis target not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
          python -m py_compile chatgpt_todo/raw_pid_20260907/raw_pid_analysis.py chatgpt_todo/raw_pid_20260907/build_raw_pid_notebook.py
      - name: Build step-by-step Jupyter notebook
        run: |
          python chatgpt_todo/raw_pid_20260907/build_raw_pid_notebook.py
      - name: Execute raw-data and MC PID analysis notebook
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=3600 \
            --output ccb_raw_pid_notebook_executed.ipynb \
            ccb_raw_pid_notebook.ipynb
      - name: Package reproducible scientific artifact
        shell: bash
        run: |
          set -euo pipefail
          cp ccb_raw_pid_notebook.ipynb artifact/ccb_raw_pid_notebook_source.ipynb
          cp ccb_raw_pid_notebook_executed.ipynb artifact/ccb_raw_pid_notebook_executed.ipynb
          cp chatgpt_todo/raw_pid_20260907/raw_pid_analysis.py artifact/raw_pid_analysis.py
          python -m pip freeze > artifact/pip_freeze.txt
          rm -rf artifact/hf_cache
          find artifact -maxdepth 2 -type f -printf '%P %s bytes\n' | sort > artifact/ARTIFACT_CONTENTS.txt
      - name: Upload executed notebook and all source tables/figures
        uses: actions/upload-artifact@v4
        with:
          name: ccb-raw-pid-notebook
          path: artifact
          if-no-files-found: error
          retention-days: 30
