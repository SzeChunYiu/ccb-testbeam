# CCB response / quenching / material / observation-window hypothesis registry
# (Wave B Lane 05).
# schema: ccb-response-registry/1
#
# CRITICAL: There is NO approved silent default for quenching model form,
# fibre outer-cladding transport material, or observation-window domain.
# Callers MUST set the relevant profile id. Unset -> ConfigurationError.
#
# Birks/material contradictions are recorded as named HYPOTHESIS profiles.
# Selecting a profile documents which hypothesis a run assumes; it does NOT
# resolve the contradiction or authorize "validated light response" claims.

schema: ccb-response-registry/1
registry_version: "2026.0-waveB-lane05"
default_quenching_profile_id: null
default_fibre_clad_profile_id: null
default_observation_window_profile_id: null
fail_closed_when_unset: true
