name: Remediate WIKI canonical results retry

on:
  push:
    paths:
      - ".github/workflows/remediate_wiki_canonical_results_retry.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate defect and remediate exact WIKI bytes
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python -m py_compile \
            tools/audit/validate_wiki_canonical_results.py \
            tests/test_validate_wiki_canonical_results.py
          PYTHONPATH=. python -m pytest \
            tests/test_validate_wiki_canonical_results.py -q | tee /tmp/pre_pytest.txt
          set +e
          PYTHONPATH=. python tools/audit/validate_wiki_canonical_results.py \
            WIKI.md docs/claim_ledger.csv --output /tmp/before.json >/tmp/before.txt
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/before.json').read_text())
          assert before['status'] == 'FLAWED'
          codes = {item['code'] for item in before['issues']}
          assert {
              'STATUS_LEDGER_MISMATCH',
              'TRUTH_TYPE_LEDGER_MISMATCH',
              'VALUE_NOT_WITHHELD',
              'UNSUPPORTED_WIKI_UNCERTAINTY',
              'MISSING_REVIEW_LEGEND_STATUS',
              'MISSING_CURRENT_PCA_CORRECTION',
              'STALE_PUBLIC_CLAIM_PRESENT',
          }.issubset(codes)

          path = Path('WIKI.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '| **GATED** | Promising result, not adopted until controls pass |\n| **SUPERSEDED** | Retained only as correction history; not an accepted current result |':
              '| **GATED** | Promising result, not adopted until controls pass |\n| **REVIEW** | Source-backed qualitative diagnostic requiring further review; not an accepted production result |\n| **SUPERSEDED** | Retained only as correction history; not an accepted current result |',
              '| B6 single-stave σ₆₈ | 0.68–0.75 ns | 0.02 | 0.05 | data + digitized MC | **VALIDATED** |':
              '| B6 single-stave σ₆₈ | Withheld pending BLK-MV4-LEGACY-001 | — | — | legacy claim source unresolved | **BLOCKED** |',
              '| Combined 3-stave σ (B4+B6+B8) | 0.54–0.56 ns | 0.02 | 0.08 | data_only | **DONE_DATA_ONLY** |':
              '| Combined 3-stave σ (B4+B6+B8) | Withheld pending BLK-MV4-LEGACY-001 | — | — | legacy claim source unresolved | **BLOCKED** |',
              '| Pair covariance | −0.127 ns² | — | — | data_only | **DONE_DATA_ONLY** |':
              '| Pair covariance | Withheld pending BLK-MV4-LEGACY-001 | — | — | legacy claim source unresolved | **BLOCKED** |',
              '| Digitizer gain (MV0 v2) | 92 ± 28 ADC/MeV | 14 | 28 | digitized MC | **VALIDATED** |':
              '| Digitizer gain (MV0 v2) | 92 ADC/MeV | — | 28 | data + MC calibration proxy | **GATED** |',
              '| p/d PID AUC | 0.9860 | — | — | MC truth only | **TRUTH_LEVEL_MC_ONLY** |':
              '| p/d PID AUC | 0.9860 | — | — | MC truth only | **GATED** |',
              '| MV3 B8 data/MC | data 2.3% / MC 22.3% | — | — | MC vs data | **FAIL** |':
              '| MV3 legacy B8 fractions / profile statistic | data 2.3%; MC 22.3%; reported χ²/ndf label 68269.4 | — | — | legacy data/MC profile diagnostic | **FLAWED** |',
              '| MV4 raw timing pull | −1.05σ | — | — | digitized MC | **VALIDATED** |':
              '| MV4 raw timing pull | −1.05σ | — | — | legacy toy-digitizer diagnostic | **GATED** |',
              '| MV4 corrected timing pull | +2.68σ | — | — | digitized MC | **TENSION** |':
              '| MV4 corrected timing pull | +2.68σ | — | — | legacy toy-digitizer diagnostic | **GATED** |',
              '| ML timing | Diagnostic only | — | — | data_only | **GATED** |':
              '| ML timing | REVIEW diagnostic | — | — | legacy toy-digitizer diagnostic | **REVIEW** |',
              '| PCA 3 PCs 89%, 8 PCs 99.7% | Needs canonical rerun | Variance normalization inconsistent |':
              '| PCA 3 PCs 89%, 8 PCs 99.7% | PCA 3 PCs 72.546%, 8 PCs 82.188% (synthetic-waveform MC only) | Source-backed fixed MV6 synthetic-waveform output; no beam-data transfer claim |',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          PYTHONPATH=. python tools/audit/validate_wiki_canonical_results.py \
            WIKI.md docs/claim_ledger.csv \
            --output docs/validation/wiki_canonical_results_validation.json \
            >/tmp/after.txt
          PYTHONPATH=. python tools/audit/validate_wiki_claim_front_door.py \
            WIKI.md docs/claim_ledger.csv --output /tmp/front.json >/tmp/front.txt
          PYTHONPATH=. python -m pytest \
            tests/test_validate_wiki_canonical_results.py \
            tests/test_validate_wiki_claim_front_door.py \
            tests/test_wiki_claim_front_door_current.py -q | tee /tmp/post_pytest.txt
          python - <<'PY'
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          before = json.loads(Path('/tmp/before.json').read_text())
          after = json.loads(Path(
              'docs/validation/wiki_canonical_results_validation.json'
          ).read_text())
          front = json.loads(Path('/tmp/front.json').read_text())
          assert after['status'] == 'VALIDATED' and after['n_issues'] == 0
          assert front['status'] == 'VALIDATED' and front['n_issues'] == 0
          wiki = Path('WIKI.md').read_bytes()
          ledger = Path('docs/claim_ledger.csv').read_bytes()
          post = Path('/tmp/post_pytest.txt').read_text().strip()
          Path('docs/validation/wiki_canonical_results_audit.md').write_text(
              f'''# WIKI canonical-results remediation audit

The public canonical-results table was checked against 11 exact-width records
in `docs/claim_ledger.csv`. It had continued to publish source-absent MV4 values,
unsupported status upgrades and uncertainty fields, and superseded MV6 PCA
percentages after the canonical ledger was corrected.

The corrected WIKI now withholds `CL-002`, `CL-004`, and `CL-006`; labels MV0,
legacy PID, MV3, and MV4 diagnostics with their exact ledger states; identifies
the timing method as analytic `REVIEW`; and records MV6 synthetic-waveform PCA
as 72.546% at 3 PCs and 82.188% at 8 PCs.

- WIKI bytes: `{len(wiki)}`
- WIKI SHA-256: `{hashlib.sha256(wiki).hexdigest()}`
- ledger bytes: `{len(ledger)}`
- ledger SHA-256: `{hashlib.sha256(ledger).hexdigest()}`
- pre-remediation findings: `{before['n_issues']}`
- post-remediation findings: `0`
- policy: `{after['policy']}`
- tests: `{post}`

This is documentation/provenance evidence, not detector data. It does not create
new timing, calibration, PID, stopping-profile, or anomaly-transfer results.
''', encoding='utf-8')
          labels = [
              ('B6 sigma68', 'VALIDATED', 'BLOCKED'),
              ('3-stave sigma', 'DONE_DATA_ONLY', 'BLOCKED'),
              ('covariance', 'DONE_DATA_ONLY', 'BLOCKED'),
              ('MV0 gain', 'VALIDATED', 'GATED'),
              ('PID AUC', 'TRUTH_LEVEL_MC_ONLY', 'GATED'),
              ('MV3 profile', 'FAIL', 'FLAWED'),
              ('MV4 raw', 'VALIDATED', 'GATED'),
              ('MV4 corrected', 'TENSION', 'GATED'),
              ('timing method', 'GATED ML', 'REVIEW analytic'),
          ]
          parts = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" '
              'viewBox="0 0 960 500" role="img" aria-labelledby="title desc">',
              '<title id="title">WIKI canonical result remediation</title>',
              '<desc id="desc">Text-labelled former and ledger-backed states; '
              'documentation evidence, not detector data.</desc>',
              '<defs><marker id="a" markerWidth="10" markerHeight="10" '
              'refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" '
              'fill="black"/></marker></defs>',
              '<rect width="100%" height="100%" fill="white"/>',
              '<text x="20" y="30" font-family="sans-serif" font-size="21" '
              'font-weight="bold">WIKI claims synchronized to exact ledger rows</text>',
              '<text x="20" y="53" font-family="sans-serif" font-size="13">'
              'Documentation/provenance evidence — no detector measurement</text>',
          ]
          for i, (label, old, new) in enumerate(labels):
              y = 92 + 40 * i
              parts.extend([
                  f'<text x="20" y="{y}" font-family="sans-serif" '
                  f'font-size="13">{label}</text>',
                  f'<rect x="185" y="{y-20}" width="280" height="27" '
                  'fill="white" stroke="black" stroke-dasharray="6 4"/>',
                  f'<text x="325" y="{y-2}" text-anchor="middle" '
                  f'font-family="monospace" font-size="11">{old}</text>',
                  f'<line x1="475" y1="{y-7}" x2="540" y2="{y-7}" '
                  'stroke="black" marker-end="url(#a)"/>',
                  f'<rect x="550" y="{y-20}" width="380" height="27" '
                  'fill="#eeeeee" stroke="black"/>',
                  f'<text x="740" y="{y-2}" text-anchor="middle" '
                  f'font-family="monospace" font-size="11">{new}</text>',
              ])
          parts.extend([
              '<text x="20" y="480" font-family="sans-serif" font-size="12">'
              'Policy: WIKI_CANONICAL_RESULTS_MUST_MATCH_EXACT_WIDTH_LEDGER_ROWS; '
              'post-remediation issues: 0</text>',
              '</svg>',
          ])
          svg = Path('docs/validation/wiki_canonical_results.svg')
          svg.write_text('\n'.join(parts) + '\n', encoding='utf-8')
          ET.parse(svg)
          PY
          git diff --check
      - name: Commit and push validated remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/remediate_wiki_canonical_results_once.yml \
            .github/workflows/remediate_wiki_canonical_results_retry.yml
          git config user.name "scheduled-scientific-review"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            .github/workflows/remediate_wiki_canonical_results_once.yml \
            .github/workflows/remediate_wiki_canonical_results_retry.yml \
            WIKI.md \
            docs/validation/wiki_canonical_results_audit.md \
            docs/validation/wiki_canonical_results_validation.json \
            docs/validation/wiki_canonical_results.svg
          git commit -m "docs(wiki): synchronize canonical results with ledger"
          git push origin HEAD:main
