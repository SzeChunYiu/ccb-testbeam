<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="white"/>
  <text x="550" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Stopping-power report reproducibility gate</text>
  <text x="550" y="72" text-anchor="middle" font-family="sans-serif" font-size="16">Synthetic regression evidence — not detector data</text>
  <rect x="55" y="115" width="450" height="380" rx="16" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="280" y="155" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold">Former report</text>
  <text x="90" y="205" font-family="monospace" font-size="18">sim_total = 1.944000...</text>
  <text x="90" y="240" font-family="monospace" font-size="18">delta = -2.80%</text>
  <text x="90" y="275" font-family="monospace" font-size="18">status = FAIL</text>
  <line x1="90" y1="320" x2="465" y2="320" stroke="#555" stroke-width="2"/>
  <text x="90" y="360" font-family="sans-serif" font-size="18">Missing:</text>
  <text x="115" y="394" font-family="sans-serif" font-size="17">Σ deposit, Σ track, density, tolerance, formula</text>
  <line x1="85" y1="185" x2="470" y2="455" stroke="#b00020" stroke-width="7"/>
  <line x1="470" y1="185" x2="85" y2="455" stroke="#b00020" stroke-width="7"/>
  <rect x="595" y="115" width="450" height="430" rx="16" fill="#eef7ee" stroke="#333" stroke-width="2"/>
  <text x="820" y="155" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold">Corrected report</text>
  <text x="630" y="205" font-family="monospace" font-size="17">deposit_sum_MeV = 1.2</text>
  <text x="630" y="238" font-family="monospace" font-size="17">track_length_sum_mm = 5.0</text>
  <text x="630" y="271" font-family="monospace" font-size="17">material_density_g_cm3 = 1.23456789</text>
  <text x="630" y="304" font-family="monospace" font-size="17">tolerance_percent = 2.3456789</text>
  <text x="630" y="350" font-family="sans-serif" font-size="17">Estimator:</text>
  <text x="650" y="382" font-family="monospace" font-size="15">(ΣE / ΣL) × 10 / ρ</text>
  <text x="630" y="425" font-family="sans-serif" font-size="17">Independent reconstruction:</text>
  <text x="650" y="457" font-family="monospace" font-size="16">1.2 / 5 × 10 / 1.23456789</text>
  <text x="650" y="489" font-family="monospace" font-size="16">= 1.944000...</text>
  <path d="M520 310 L575 310" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
  <text x="550" y="590" text-anchor="middle" font-family="sans-serif" font-size="16">Acceptance remains diagnostic-only until a validated observable and uncertainty budget exist.</text>
</svg>
