<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Cross-energy stopping-power reporting remediation</title>
  <desc id="desc">Synthetic regression evidence showing two separate energy-point ratios, descriptive bounds, and no combined estimate.</desc>
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Cross-energy reporting: separate points, no combined estimate</text>
  <text x="480" y="66" text-anchor="middle" font-family="sans-serif" font-size="15">Synthetic software regression evidence — not detector data</text>
  <line x1="120" y1="400" x2="840" y2="400" stroke="black" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="400" stroke="black" stroke-width="2"/>
  <text x="480" y="455" text-anchor="middle" font-family="sans-serif" font-size="18">Configured energy [MeV]</text>
  <text x="35" y="250" text-anchor="middle" transform="rotate(-90 35 250)" font-family="sans-serif" font-size="18">Point-estimate simulation/PSTAR ratio</text>
  <line x1="110" y1="160" x2="120" y2="160" stroke="black"/>
  <text x="96" y="166" text-anchor="end" font-family="sans-serif" font-size="14">1.0</text>
  <line x1="110" y1="320" x2="120" y2="320" stroke="black"/>
  <text x="96" y="326" text-anchor="end" font-family="sans-serif" font-size="14">0.8</text>
  <line x1="300" y1="400" x2="300" y2="410" stroke="black"/>
  <text x="300" y="430" text-anchor="middle" font-family="sans-serif" font-size="14">1</text>
  <line x1="660" y1="400" x2="660" y2="410" stroke="black"/>
  <text x="660" y="430" text-anchor="middle" font-family="sans-serif" font-size="14">2</text>
  <circle cx="300" cy="160" r="9" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="660" cy="320" r="9" fill="white" stroke="black" stroke-width="3"/>
  <line x1="760" y1="160" x2="800" y2="160" stroke="black" stroke-width="3"/>
  <line x1="780" y1="160" x2="780" y2="320" stroke="black" stroke-width="3"/>
  <line x1="760" y1="320" x2="800" y2="320" stroke="black" stroke-width="3"/>
  <text x="815" y="235" font-family="sans-serif" font-size="15">descriptive</text>
  <text x="815" y="255" font-family="sans-serif" font-size="15">range only</text>
  <rect x="180" y="92" width="430" height="48" fill="white" stroke="black" stroke-dasharray="6 5"/>
  <text x="395" y="122" text-anchor="middle" font-family="monospace" font-size="14">NO_CROSS_ENERGY_COMBINATION_WITHOUT_UNCERTAINTY_MODEL</text>
  <line x1="250" y1="360" x2="710" y2="205" stroke="black" stroke-width="4"/>
  <line x1="250" y1="205" x2="710" y2="360" stroke="black" stroke-width="4"/>
  <text x="480" y="285" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="white" stroke="white" stroke-width="5" paint-order="stroke">No arithmetic mean</text>
  <text x="480" y="285" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">No arithmetic mean</text>
  <text x="480" y="495" text-anchor="middle" font-family="sans-serif" font-size="14">Each energy point remains individually reported and individually non-accepted without uncertainty.</text>
</svg>
