<svg xmlns="http://www.w3.org/2000/svg" width="980" height="510" viewBox="0 0 980 510" role="img" aria-labelledby="title desc">
<title id="title">Legacy MV4 timing claim audit</title>
<desc id="desc">Software and provenance evidence showing seven malformed timing rows, five unsupported source values, one overclaimed toy pull, and one incorrectly labelled machine-learning verdict.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#555" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" font-family="sans-serif" font-size="24" font-weight="bold">Legacy MV4 timing claims fail the source/provenance gate</text>
<text x="30" y="65" font-family="sans-serif" font-size="14">Synthetic software/provenance visualization — not detector data</text>
<text x="30" y="105" font-family="sans-serif" font-size="17" font-weight="bold">Current ledger state</text>
<rect x="30" y="125" width="410" height="225" fill="url(#hatch)" stroke="black"/>
<text x="50" y="158" font-family="monospace" font-size="15">CL-002..006: widths 38,39,38,38,39</text>
<text x="50" y="190" font-family="monospace" font-size="15">CL-008..009: widths 37,37</text>
<text x="50" y="222" font-family="monospace" font-size="15">0.68 / 0.75 / 0.54 / 0.56 / -0.127</text>
<text x="50" y="247" font-family="sans-serif" font-size="14">absent from cited report and summary</text>
<text x="50" y="282" font-family="monospace" font-size="15">CL-007: VALIDATED/PASS overclaim</text>
<text x="50" y="317" font-family="monospace" font-size="15">CL-009: “ML” method absent from source</text>
<text x="540" y="105" font-family="sans-serif" font-size="17" font-weight="bold">Source-backed facts</text>
<rect x="520" y="125" width="420" height="225" fill="#e6e6e6" stroke="black"/>
<text x="540" y="158" font-family="monospace" font-size="15">80,000 tracks; 241,487 scanned events</text>
<text x="540" y="190" font-family="monospace" font-size="15">raw σ68 = 1.744319 ns</text>
<text x="540" y="222" font-family="monospace" font-size="15">corrected σ68 = 1.769615 ns</text>
<text x="540" y="254" font-family="monospace" font-size="15">pulls = -1.054403, +2.680529</text>
<text x="540" y="286" font-family="monospace" font-size="15">data uncertainty = assumed 0.10 ns</text>
<text x="540" y="318" font-family="sans-serif" font-size="14">Current contract: TOY_DIAGNOSTIC + --strict inputs</text>
<line x1="440" y1="237" x2="520" y2="237" stroke="black" stroke-width="3"/>
<text x="30" y="395" font-family="sans-serif" font-size="17" font-weight="bold">Required remediation</text>
<text x="30" y="425" font-family="sans-serif" font-size="14">Withhold unsupported per-stave/combined/covariance numbers; retain pulls only as gated toy diagnostics;</text>
<text x="30" y="449" font-family="sans-serif" font-size="14">rename the categorical result as analytic REVIEW; rerun with immutable calibration, measured anchors,</text>
<text x="30" y="473" font-family="sans-serif" font-size="14">run-group validation, per-stave metrics, and a full covariance matrix before performance claims.</text>
</svg>
