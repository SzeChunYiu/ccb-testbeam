<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-labelledby="title desc">
<title id="title">Claim-ledger validator output-safety remediation</title>
<desc id="desc">Synthetic software controls compare the former direct-write algorithm with the fail-closed atomic publication contract.</desc>
<rect width="940" height="330" fill="white"/>
<text x="24" y="34" font-family="sans-serif" font-size="22" font-weight="bold">Claim-ledger output safety</text>
<text x="24" y="58" font-family="sans-serif" font-size="13">Synthetic software/provenance controls; no physics data or detector result.</text>
<text x="24" y="94" font-family="sans-serif" font-size="14" font-weight="bold">Control</text>
<text x="280" y="94" font-family="sans-serif" font-size="14" font-weight="bold">Former v1.0.0</text>
<text x="570" y="94" font-family="sans-serif" font-size="14" font-weight="bold">Current v1.1.0</text>
<line x1="20" y1="106" x2="920" y2="106" stroke="black" stroke-width="1"/>
<text x="24" y="130" font-family="sans-serif" font-size="13">Input/output alias</text>
<text x="280" y="130" font-family="sans-serif" font-size="13">overwrites ledger</text>
<text x="570" y="130" font-family="sans-serif" font-size="13">status 2; ledger preserved</text>
<line x1="20" y1="160" x2="920" y2="160" stroke="black" stroke-width="1"/>
<text x="24" y="184" font-family="sans-serif" font-size="13">Replace failure</text>
<text x="280" y="184" font-family="sans-serif" font-size="13">direct final write</text>
<text x="570" y="184" font-family="sans-serif" font-size="13">previous output preserved</text>
<line x1="20" y1="214" x2="920" y2="214" stroke="black" stroke-width="1"/>
<text x="24" y="238" font-family="sans-serif" font-size="13">Publication</text>
<text x="280" y="238" font-family="sans-serif" font-size="13">Path.write_text</text>
<text x="570" y="238" font-family="sans-serif" font-size="13">temp + fsync + os.replace</text>
<line x1="20" y1="268" x2="920" y2="268" stroke="black"/>
<text x="24" y="296" font-family="monospace" font-size="12">former overwrite reproduced: true; current input preserved: true; failure preserves output: true</text>
<text x="24" y="318" font-family="monospace" font-size="11">policy: CLAIM_LEDGER_VALIDATION_OUTPUTS_MUST_BE_DISTINCT_AND_ATOMIC</text>
</svg>
