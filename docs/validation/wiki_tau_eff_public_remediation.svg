<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">S10b live-time public WIKI remediation evidence</title>
  <desc id="desc">Software and documentation validation summary; not detector data.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">S10b live-time public WIKI remediation</text>
  <text x="60" y="108" font-family="sans-serif" font-size="20">Exact-section software/documentation evidence — not detector data</text>
  <rect x="60" y="150" width="1080" height="92" rx="12" fill="#eef5ff" stroke="#335c9b" stroke-width="2"/>
  <text x="85" y="188" font-family="monospace" font-size="20">124.79018394263471 ns</text>
  <text x="85" y="220" font-family="monospace" font-size="18">run-bootstrap 95% CI [123.33094981246663, 126.35875117626817] ns</text>
  <g font-family="sans-serif" font-size="20">
    <rect x="60" y="280" width="330" height="150" rx="12" fill="#f2fff4" stroke="#2d7a3f" stroke-width="2"/>
    <text x="85" y="320" font-weight="700">Canonical table</text>
    <text x="85" y="358">Exact value + interval</text>
    <text x="85" y="390">data_measurement</text>
    <text x="85" y="420">DONE_DATA_ONLY</text>

    <rect x="435" y="280" width="330" height="150" rx="12" fill="#f2fff4" stroke="#2d7a3f" stroke-width="2"/>
    <text x="460" y="320" font-weight="700">Pile-up section</text>
    <text x="460" y="358">14 runs; 252266 pulses</text>
    <text x="460" y="390">Non-universal estimand</text>
    <text x="460" y="420">MV5 reuse, not validation</text>

    <rect x="810" y="280" width="330" height="150" rx="12" fill="#f2fff4" stroke="#2d7a3f" stroke-width="2"/>
    <text x="835" y="320" font-weight="700">Validation checks</text>
    <text x="835" y="358">0 snapshot issues</text>
    <text x="835" y="390">Integration test compiles</text>
    <text x="835" y="420">Chapter link target exists</text>
  </g>
  <rect x="60" y="470" width="1080" height="122" rx="12" fill="#fff8e8" stroke="#9a6a00" stroke-width="2"/>
  <text x="85" y="510" font-family="sans-serif" font-size="20" font-weight="700">Scientific boundary</text>
  <text x="85" y="545" font-family="sans-serif" font-size="18">This confirms public binding to the tracked S10b data-only estimand.</text>
  <text x="85" y="575" font-family="sans-serif" font-size="18">It does not establish a universal detector dead time, accepted Rmax, or new uncertainty model.</text>
  <text x="60" y="655" font-family="monospace" font-size="15">main 0e32bf3f5956162d30259489d6d99295280e06fb · WIKI blob 001e091f82756f45339fe5e48256a951b6331295</text>
