# CCB single-stave optical/material constants ledger (issues #979 #1088 #1086).
# Schema: key = value  (comments start with #)
# status_* fields record evidence class; HYPOTHESIS/ASSUMPTION/UNKNOWN_EXTERNAL
# are NOT detector truth. Do not promote to authorising claims without source closure.
schema = ccb-optical-constants/1
issues = 979,1000,1005,1035,1036,1085,1086,1088

# Scintillator optical constants (historically hard-coded in DetectorConstruction)
scintillator_rindex = 1.59
scintillator_rindex_status = MANUFACTURER_REPRESENTATIVE
scintillation_yield_per_MeV = 10000.0
scintillation_yield_status = MANUFACTURER_REPRESENTATIVE
scintillation_time_ns = 2.4
scintillation_time_status = MANUFACTURER_REPRESENTATIVE

# Y-11 fibre core / cladding indices and WLS timing
y11_core_rindex = 1.59
y11_core_rindex_status = MANUFACTURER_REPRESENTATIVE
wls_time_constant_ns = 8.5
wls_time_constant_status = MANUFACTURER_REPRESENTATIVE
clad_inner_rindex = 1.49
clad_outer_rindex = 1.42
clad_rindex_status = MANUFACTURER_REPRESENTATIVE

# WLS fluorescence multiplicity (#1088). Geant4 default = one secondary per absorption.
# WLSMEANNUMBERPHOTONS uses Poisson(mu); mu=1 is NOT identical to Bernoulli(q=1) variance
# when mu!=1. Status is ASSUMPTION until a Y-11 quantum-yield source is bound.
wls_mean_number_photons = 1.0
wls_fluorescence_model = geant4_default_one_secondary
wls_fluorescence_status = ASSUMPTION_UNIT_YIELD
# #1088 three-mode multiplicity contract (CLI --wls-fluorescence-model):
#   geant4_default_one_secondary: WLSMEANNUMBERPHOTONS property absent ->
#     G4OpWLS re-emits exactly one secondary per absorption.
#   geant4_poisson_mean: property set -> G4OpWLS samples Poisson(mu) per
#     absorption (Geant4 11.2.2 samples Poisson whenever the property exists,
#     even at mu=1: P(0)=0.368, P(>=2)=0.264).
#   bernoulli_thinned: property absent; StackingAction kills each OpWLS
#     re-emission with probability 1-q -> Bernoulli(q) effective yield.
# q source: Y-11(K27) quantum yield 0.70, Pla-Dalmau, Foster, Zhang,
# NIM A361 (1995) 192-196; Bernoulli implementation precedent: Elpers,
# Huang, Lang, Proga, arXiv:1911.03790 sec. 4.
wls_fluorescence_yield = 0.70

# Y-11 direct charged-particle scintillation (#1035). 0 = current omission.
y11_direct_scint_yield_per_MeV = 0.0
y11_direct_scint_status = OMISSION_UNKNOWN_EXTERNAL

# Y-11 bulk attenuation model form (#1085)
y11_attenuation_form = long_component_single_exponential
y11_attenuation_form_status = MANUFACTURER_LONG_COMPONENT_PRIOR

# Fibre-hole coupling fill indices for named hypotheses (#1036). Not CCB truth.
coupling_grease_rindex = 1.46
coupling_epoxy_rindex = 1.50
coupling_index_status = HYPOTHESIS_CATALOGUE_NOT_CCB_HARDWARE

# TiO2 UNIFIED reflection hypothesis (#1086). finish=ground is valid for dielectric_metal.
# Zero lobe/spike/backscatter => explicit Lambertian (matches prior unintended default).
tio2_finish = ground
tio2_sigma_alpha = 0.1
tio2_specular_lobe = 0.0
tio2_specular_spike = 0.0
tio2_backscatter = 0.0
tio2_reflection_model_status = EXPLICIT_LAMBERTIAN_HYPOTHESIS

# Coating charged-particle material (#1005). air_massless_placeholder is NOT physical mass.
# tio2_paint_hypothesis values are provisional literature placeholders, not CCB paint assays.
coating_material_default = air_massless_placeholder
tio2_paint_density_g_cm3 = 1.5
tio2_paint_density_status = HYPOTHESIS_UNVERIFIED
