<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Stopping-power report output-path safety audit</title>
  <desc id="desc">Synthetic software audit showing unsafe direct final-path writes and the required alias rejection plus atomic publication method.</desc>
  <rect x="0" y="0" width="1200" height="700" fill="white"/>
  <text x="600" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold">Stopping-power report output safety</text>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="16">Synthetic software/provenance evidence — not detector data</text>

  <rect x="55" y="115" width="510" height="470" fill="#f7f7f7" stroke="black" stroke-width="2"/>
  <text x="310" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Current direct-write path: FLAWED</text>
  <rect x="95" y="190" width="180" height="72" fill="white" stroke="black" stroke-width="2"/>
  <text x="185" y="220" text-anchor="middle" font-family="monospace" font-size="16">--sim input.csv</text>
  <text x="185" y="244" text-anchor="middle" font-family="sans-serif" font-size="14">validated + hashed</text>
  <rect x="340" y="190" width="180" height="72" fill="white" stroke="black" stroke-width="2"/>
  <text x="430" y="220" text-anchor="middle" font-family="monospace" font-size="16">--reference ref.csv</text>
  <text x="430" y="244" text-anchor="middle" font-family="sans-serif" font-size="14">validated + hashed</text>
  <line x1="185" y1="262" x2="300" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="262" x2="320" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="185" y="330" width="250" height="78" fill="white" stroke="black" stroke-width="2"/>
  <text x="310" y="360" text-anchor="middle" font-family="monospace" font-size="15">out_path.open("w")</text>
  <text x="310" y="386" text-anchor="middle" font-family="sans-serif" font-size="14">writes final path immediately</text>
  <line x1="310" y1="408" x2="310" y2="468" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130" y="468" width="360" height="75" fill="white" stroke="black" stroke-width="2"/>
  <text x="310" y="496" text-anchor="middle" font-family="sans-serif" font-size="15">If --out aliases an input: input bytes destroyed</text>
  <text x="310" y="521" text-anchor="middle" font-family="sans-serif" font-size="15">If writing fails: truncated final report may remain</text>
  <line x1="105" y1="170" x2="515" y2="555" stroke="black" stroke-width="7"/>
  <line x1="515" y1="170" x2="105" y2="555" stroke="black" stroke-width="7"/>

  <rect x="635" y="115" width="510" height="470" fill="#f7f7f7" stroke="black" stroke-width="2"/>
  <text x="890" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Required publication contract</text>
  <rect x="690" y="190" width="400" height="62" fill="white" stroke="black" stroke-width="2"/>
  <text x="890" y="217" text-anchor="middle" font-family="monospace" font-size="15">_validate_output_path(out, sim, ref)</text>
  <text x="890" y="239" text-anchor="middle" font-family="sans-serif" font-size="14">reject resolved equality / aliasing</text>
  <line x1="890" y1="252" x2="890" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="300" width="400" height="62" fill="white" stroke="black" stroke-width="2"/>
  <text x="890" y="327" text-anchor="middle" font-family="sans-serif" font-size="15">Serialize complete CSV to same-directory temporary file</text>
  <text x="890" y="349" text-anchor="middle" font-family="sans-serif" font-size="14">close successfully; remove temporary file on failure</text>
  <line x1="890" y1="362" x2="890" y2="410" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="410" width="400" height="62" fill="white" stroke="black" stroke-width="2"/>
  <text x="890" y="438" text-anchor="middle" font-family="monospace" font-size="16">os.replace(temp, out)</text>
  <text x="890" y="460" text-anchor="middle" font-family="sans-serif" font-size="14">publish only the complete artifact atomically</text>
  <line x1="890" y1="472" x2="890" y2="520" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="520" width="400" height="45" fill="white" stroke="black" stroke-width="2"/>
  <text x="890" y="548" text-anchor="middle" font-family="sans-serif" font-size="15">Preserve inputs; record final report bytes + SHA-256</text>

  <text x="600" y="630" text-anchor="middle" font-family="monospace" font-size="17">NO_INPUT_OUTPUT_ALIAS_AND_ATOMIC_REPORT_WRITE</text>
  <text x="600" y="662" text-anchor="middle" font-family="sans-serif" font-size="15">Software/provenance acceptance only; stopping-power physics closure remains separate.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
</svg>
