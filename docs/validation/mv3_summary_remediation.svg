<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Exact legacy MV3 source-governance validation</title>
<desc id="desc">The tracked summary contains exact B8 counts and an exactly reconstructable Pearson chi-square diagnostic. The diagnostic remains scientifically non-accepting because geometry, selection transfer, covariance and systematics are unresolved.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#444" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" font-family="sans-serif" font-size="24" font-weight="bold">Legacy MV3: exact tracked arithmetic, flawed physics closure</text>
<text x="30" y="66" font-family="sans-serif" font-size="14">Software/documentation validation — not a new detector-data result.</text>
<text x="30" y="110" font-family="sans-serif" font-size="18" font-weight="bold">Exact B8 fractions from tracked counts</text>
<text x="30" y="160" font-family="sans-serif" font-size="15">Thresholded MC</text>
<rect x="170" y="140" width="160.5" height="30" fill="url(#hatch)" stroke="black"/>
<text x="340.5" y="162" font-family="monospace" font-size="14">55619/249484 = 0.22293614019335908</text>
<text x="30" y="215" font-family="sans-serif" font-size="15">Selected data</text>
<rect x="170" y="195" width="16.6" height="30" fill="#d9d9d9" stroke="black"/>
<text x="196.6" y="217" font-family="monospace" font-size="14">7051/306745 = 0.022986519747673149</text>
<line x1="30" y1="260" x2="1010" y2="260" stroke="black"/>
<text x="30" y="300" font-family="sans-serif" font-size="18" font-weight="bold">Reconstructed fixed-source diagnostic</text>
<text x="30" y="334" font-family="monospace" font-size="16">Pearson χ² = 204808.2179684494; ndf = 3; χ²/ndf = 68269.40598948312982</text>
<text x="30" y="370" font-family="sans-serif" font-size="14">Expected counts use selected-data total × exact thresholded-MC fractions.</text>
<text x="30" y="410" font-family="sans-serif" font-size="18" font-weight="bold">Acceptance boundary</text>
<text x="30" y="440" font-family="sans-serif" font-size="14">Exact arithmetic does not repair geometry/material modelling, trigger and selection transfer, gain response, covariance, or detector/model systematics.</text>
<text x="30" y="470" font-family="sans-serif" font-size="14">Strict current MV3 remains fail-closed without sample_label and per-layer hit masks.</text>
<text x="30" y="525" font-family="sans-serif" font-size="12">Status: VALIDATED; policy: TRACKED_MV3_SUMMARY_EXACT_COUNTS_WITH_FAIL_CLOSED_STRICT_RERUN</text>
</svg>
