<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MV3 Pearson chi-square producer remediation evidence</title>
  <desc id="desc">Synthetic software evidence comparing two former fail-open controls with the corrected fail-closed contract, plus focused and repository-wide CI status.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="32" font-weight="bold">MV3 Pearson model-support remediation</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Synthetic software/statistical evidence — not detector data</text>

  <rect x="60" y="150" width="510" height="215" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="85" y="188" font-family="sans-serif" font-size="22" font-weight="bold">Former behavior</text>
  <text x="85" y="230" font-family="monospace" font-size="17">model [0.50,0.50,0,0]</text>
  <text x="85" y="258" font-family="monospace" font-size="17">observed [45,45,10,0]</text>
  <text x="85" y="292" font-family="sans-serif" font-size="19">B6 was dropped; χ²/ndf = 1.0</text>
  <text x="85" y="330" font-family="sans-serif" font-size="19">Profile sum 0.95 accepted; χ²/ndf = 2.5</text>

  <rect x="630" y="150" width="510" height="215" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="655" y="188" font-family="sans-serif" font-size="22" font-weight="bold">Corrected contract</text>
  <text x="655" y="235" font-family="sans-serif" font-size="19">Observed mass outside support: REJECTED</text>
  <text x="655" y="278" font-family="sans-serif" font-size="19">Nonunit categorical profile: REJECTED</text>
  <text x="655" y="321" font-family="sans-serif" font-size="19">Empty zero-support categories: omitted from ndf</text>

  <rect x="60" y="410" width="510" height="190" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="85" y="450" font-family="sans-serif" font-size="22" font-weight="bold">Focused exact-tree gate</text>
  <text x="85" y="492" font-family="sans-serif" font-size="19">Run 30181818650: SUCCESS</text>
  <text x="85" y="528" font-family="sans-serif" font-size="19">Compile, focused pytest, source audit, line length</text>
  <text x="85" y="564" font-family="sans-serif" font-size="19">Exact-source findings: 0</text>

  <rect x="630" y="410" width="510" height="190" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="655" y="450" font-family="sans-serif" font-size="22" font-weight="bold">Repository-wide gate</text>
  <text x="655" y="492" font-family="sans-serif" font-size="19">Run 30181818642: FAILURE</text>
  <text x="655" y="528" font-family="sans-serif" font-size="19">775 passed; 42 failed; 1 skipped</text>
  <text x="655" y="564" font-family="sans-serif" font-size="19">Candidate failures: 0; merge remains blocked</text>

  <line x1="60" y1="640" x2="1140" y2="640" stroke="#222"/>
  <text x="60" y="678" font-family="sans-serif" font-size="16">Policy: PEARSON_CHI2_MUST_REJECT_OUT_OF_SUPPORT_DATA_AND_NONUNIT_PROFILES</text>
</svg>
