name: Remediate WIKI canonical results once

on:
  push:
    paths:
      - ".github/workflows/remediate_wiki_canonical_results_once.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update and validate exact WIKI claims
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python -m py_compile \
            tools/audit/validate_wiki_canonical_results.py \
            tools/audit/validate_wiki_claim_front_door.py \
            tests/test_validate_wiki_canonical_results.py \
            tests/test_validate_wiki_claim_front_door.py \
            tests/test_wiki_claim_front_door_current.py
          PYTHONPATH=. python -m pytest \
            tests/test_validate_wiki_canonical_results.py \
            tests/test_validate_wiki_claim_front_door.py \
            tests/test_wiki_claim_front_door_current.py -q | tee /tmp/pytest.txt

          set +e
          PYTHONPATH=. python tools/audit/validate_wiki_canonical_results.py \
            WIKI.md docs/claim_ledger.csv --output /tmp/wiki_before.json \
            >/tmp/wiki_before_stdout.txt
          before_status=$?
          set -e
          test "$before_status" -eq 1

          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/wiki_before.json').read_text())
          assert before['status'] == 'FLAWED'
          codes = {issue['code'] for issue in before['issues']}
          required = {
              'STATUS_LEDGER_MISMATCH',
              'TRUTH_TYPE_LEDGER_MISMATCH',
              'VALUE_NOT_WITHHELD',
              'UNSUPPORTED_WIKI_UNCERTAINTY',
              'MISSING_REVIEW_LEGEND_STATUS',
              'MISSING_CURRENT_PCA_CORRECTION',
              'STALE_PUBLIC_CLAIM_PRESENT',
          }
          assert required.issubset(codes), (required - codes, codes)

          path = Path('WIKI.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '| **GATED** | Promising result, not adopted until controls pass |\n'
                  '| **SUPERSEDED** | Retained only as correction history; not an accepted current result |',
                  '| **GATED** | Promising result, not adopted until controls pass |\n'
                  '| **REVIEW** | Source-backed qualitative diagnostic requiring further review; not an accepted production result |\n'
                  '| **SUPERSEDED** | Retained only as correction history; not an accepted current result |',
              ),
              (
                  '| B6 single-stave σ₆₈ | 0.68–0.75 ns | 0.02 | 0.05 | data + digitized MC | **VALIDATED** |',
                  '| B6 single-stave σ₆₈ | Withheld pending BLK-MV4-LEGACY-001 | — | — | legacy claim source unresolved | **BLOCKED** |',
              ),
              (
                  '| Combined 3-stave σ (B4+B6+B8) | 0.54–0.56 ns | 0.02 | 0.08 | data_only | **DONE_DATA_ONLY** |',
                  '| Combined 3-stave σ (B4+B6+B8) | Withheld pending BLK-MV4-LEGACY-001 | — | — | legacy claim source unresolved | **BLOCKED** |',
              ),
              (
                  '| Pair covariance | −0.127 ns² | — | — | data_only | **DONE_DATA_ONLY** |',
                  '| Pair covariance | Withheld pending BLK-MV4-LEGACY-001 | — | — | legacy claim source unresolved | **BLOCKED** |',
              ),
              (
                  '| Digitizer gain (MV0 v2) | 92 ± 28 ADC/MeV | 14 | 28 | digitized MC | **VALIDATED** |',
                  '| Digitizer gain (MV0 v2) | 92 ADC/MeV | — | 28 | data + MC calibration proxy | **GATED** |',
              ),
              (
                  '| p/d PID AUC | 0.9860 | — | — | MC truth only | **TRUTH_LEVEL_MC_ONLY** |',
                  '| p/d PID AUC | 0.9860 | — | — | MC truth only | **GATED** |',
              ),
              (
                  '| MV3 B8 data/MC | data 2.3% / MC 22.3% | — | — | MC vs data | **FAIL** |',
                  '| MV3 legacy B8 fractions / profile statistic | data 2.3%; MC 22.3%; reported χ²/ndf label 68269.4 | — | — | legacy data/MC profile diagnostic | **FLAWED** |',
              ),
              (
                  '| MV4 raw timing pull | −1.05σ | — | — | digitized MC | **VALIDATED** |',
                  '| MV4 raw timing pull | −1.05σ | — | — | legacy toy-digitizer diagnostic | **GATED** |',
              ),
              (
                  '| MV4 corrected timing pull | +2.68σ | — | — | digitized MC | **TENSION** |',
                  '| MV4 corrected timing pull | +2.68σ | — | — | legacy toy-digitizer diagnostic | **GATED** |',
              ),
              (
                  '| ML timing | Diagnostic only | — | — | data_only | **GATED** |',
                  '| ML timing | REVIEW diagnostic | — | — | legacy toy-digitizer diagnostic | **REVIEW** |',
              ),
              (
                  '| PCA 3 PCs 89%, 8 PCs 99.7% | Needs canonical rerun | Variance normalization inconsistent |',
                  '| PCA 3 PCs 89%, 8 PCs 99.7% | PCA 3 PCs 72.546%, 8 PCs 82.188% (synthetic-waveform MC only) | Source-backed fixed MV6 synthetic-waveform output; no beam-data transfer claim |',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          PYTHONPATH=. python tools/audit/validate_wiki_canonical_results.py \
            WIKI.md docs/claim_ledger.csv \
            --output docs/validation/wiki_canonical_results_validation.json \
            >/tmp/wiki_after_stdout.txt
          PYTHONPATH=. python tools/audit/validate_wiki_claim_front_door.py \
            WIKI.md docs/claim_ledger.csv \
            --output /tmp/wiki_front_door.json >/tmp/front_door_stdout.txt

          python - <<'PY'
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          before = json.loads(Path('/tmp/wiki_before.json').read_text())
          after = json.loads(Path(
              'docs/validation/wiki_canonical_results_validation.json'
          ).read_text())
          front = json.loads(Path('/tmp/wiki_front_door.json').read_text())
          assert after['status'] == 'VALIDATED' and after['n_issues'] == 0
          assert front['status'] == 'VALIDATED' and front['n_issues'] == 0
          assert after['ledger_columns'] == 43
          assert len(after['bindings_checked']) == 11

          wiki = Path('WIKI.md').read_bytes()
          ledger = Path('docs/claim_ledger.csv').read_bytes()
          pytest_text = Path('/tmp/pytest.txt').read_text().strip()
          report = f'''# WIKI canonical-results remediation audit

## Scope

The public `WIKI.md` canonical-results table was compared field-by-field with
11 exact-width records in `docs/claim_ledger.csv`. The former front door still
published source-absent MV4 per-stave/combined/covariance values, upgraded gated
or flawed diagnostics, assigned an unsupported MV0 statistical uncertainty, and
left superseded MV6 PCA values without the exact current replacements.

## Corrective state

- `CL-002`, `CL-004`, and `CL-006` are visibly withheld and `BLOCKED`.
- `CL-013` is a `GATED` data/MC calibration proxy with no statistical uncertainty.
- `CL-017` remains MC-truth-only and `GATED`.
- `CL-021` is labelled a legacy profile diagnostic and `FLAWED`.
- `CL-007` and `CL-008` are `GATED` toy-digitizer diagnostics.
- `CL-009` is an analytic timing `REVIEW`, not a production ML result.
- MV6 PCA history now points to 72.546% at 3 PCs and 82.188% at 8 PCs,
  explicitly for synthetic-waveform MC only.

## Exact provenance

- WIKI bytes: `{len(wiki)}`
- WIKI SHA-256: `{hashlib.sha256(wiki).hexdigest()}`
- claim-ledger bytes: `{len(ledger)}`
- claim-ledger SHA-256: `{hashlib.sha256(ledger).hexdigest()}`
- validator: `validate_wiki_canonical_results.py` v{after['version']}
- policy: `{after['policy']}`
- pre-remediation findings: `{before['n_issues']}`
- post-remediation findings: `0`
- focused test output: `{pytest_text}`

## Scientific boundary

This is documentation and claim-governance validation. It does not create a B6
resolution, combined-stave resolution, covariance measurement, timing closure,
PID data validation, gain calibration, MV3 goodness-of-fit result, or data/MC
anomaly-transfer result. Claim-specific blockers remain authoritative.
'''
          Path('docs/validation/wiki_canonical_results_audit.md').write_text(
              report, encoding='utf-8'
          )

          rows = [
              ('B6 sigma68', 'VALIDATED', 'BLOCKED'),
              ('3-stave sigma', 'DONE_DATA_ONLY', 'BLOCKED'),
              ('pair covariance', 'DONE_DATA_ONLY', 'BLOCKED'),
              ('MV0 gain', 'VALIDATED', 'GATED'),
              ('p/d PID AUC', 'TRUTH_LEVEL_MC_ONLY', 'GATED'),
              ('MV3 profile', 'FAIL', 'FLAWED'),
              ('MV4 raw pull', 'VALIDATED', 'GATED'),
              ('MV4 corrected pull', 'TENSION', 'GATED'),
              ('timing method', 'GATED ML', 'REVIEW analytic'),
          ]
          parts = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" '
              'viewBox="0 0 980 500" role="img" aria-labelledby="title desc">',
              '<title id="title">WIKI canonical result remediation</title>',
              '<desc id="desc">Text-labelled before and after claim states; '
              'repository documentation evidence, not detector data.</desc>',
              '<rect width="100%" height="100%" fill="white"/>',
              '<text x="24" y="34" font-family="sans-serif" font-size="22" '
              'font-weight="bold">Canonical WIKI claims synchronized to ledger</text>',
              '<text x="24" y="58" font-family="sans-serif" font-size="13">'
              'Documentation/provenance evidence — no detector measurement is shown</text>',
              '<text x="330" y="88" font-family="sans-serif" font-size="14" '
              'font-weight="bold">Former public state</text>',
              '<text x="690" y="88" font-family="sans-serif" font-size="14" '
              'font-weight="bold">Exact ledger-backed state</text>',
          ]
          for index, (label, old, new) in enumerate(rows):
              y = 120 + 38 * index
              parts.extend([
                  f'<text x="24" y="{y}" font-family="sans-serif" '
                  f'font-size="13">{label}</text>',
                  f'<rect x="300" y="{y - 20}" width="250" height="27" '
                  'fill="white" stroke="black" stroke-dasharray="6 4"/>',
                  f'<text x="425" y="{y - 2}" text-anchor="middle" '
                  f'font-family="monospace" font-size="12">{old}</text>',
                  f'<line x1="558" y1="{y - 7}" x2="630" y2="{y - 7}" '
                  'stroke="black" marker-end="url(#arrow)"/>',
                  f'<rect x="640" y="{y - 20}" width="300" height="27" '
                  'fill="#eeeeee" stroke="black"/>',
                  f'<text x="790" y="{y - 2}" text-anchor="middle" '
                  f'font-family="monospace" font-size="12">{new}</text>',
              ])
          parts.insert(3, '<defs><marker id="arrow" markerWidth="10" '
                         'markerHeight="10" refX="8" refY="3" orient="auto">'
                         '<path d="M0,0 L0,6 L9,3 z" fill="black"/></marker></defs>')
          parts.extend([
              '<text x="24" y="478" font-family="sans-serif" font-size="12">'
              'Policy: WIKI_CANONICAL_RESULTS_MUST_MATCH_EXACT_WIDTH_LEDGER_ROWS; '
              'post-remediation issues: 0</text>',
              '</svg>',
          ])
          svg = Path('docs/validation/wiki_canonical_results.svg')
          svg.write_text('\n'.join(parts) + '\n', encoding='utf-8')
          ET.parse(svg)
          PY

          PYTHONPATH=. python -m pytest \
            tests/test_validate_wiki_canonical_results.py \
            tests/test_validate_wiki_claim_front_door.py \
            tests/test_wiki_claim_front_door_current.py -q
          git diff --check

      - name: Commit validated WIKI remediation and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remediate_wiki_canonical_results_once.yml
          git config user.name "scheduled-scientific-review"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            .github/workflows/remediate_wiki_canonical_results_once.yml \
            WIKI.md \
            docs/validation/wiki_canonical_results_audit.md \
            docs/validation/wiki_canonical_results_validation.json \
            docs/validation/wiki_canonical_results.svg
          git commit -m "docs(wiki): synchronize canonical results with ledger"
          git push origin HEAD:main
