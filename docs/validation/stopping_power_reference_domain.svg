<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">PSTAR reference-domain gate</title>
  <desc id="desc">Schematic showing supported interpolation within the committed reference range and rejection rather than endpoint clamping outside that range.</desc>
  <rect width="960" height="420" fill="white"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">PSTAR reference lookup: supported domain versus silent clamping</text>
  <text x="480" y="64" text-anchor="middle" font-family="sans-serif" font-size="14">Synthetic regression schematic; not detector data</text>

  <rect x="90" y="105" width="190" height="210" fill="#f2f2f2" stroke="#555" stroke-dasharray="8 6"/>
  <rect x="280" y="105" width="400" height="210" fill="#e8f4ea" stroke="#1b6e2f"/>
  <rect x="680" y="105" width="190" height="210" fill="#f2f2f2" stroke="#555" stroke-dasharray="8 6"/>

  <line x1="90" y1="315" x2="870" y2="315" stroke="black" stroke-width="2"/>
  <line x1="280" y1="95" x2="280" y2="325" stroke="#1b6e2f" stroke-width="2"/>
  <line x1="680" y1="95" x2="680" y2="325" stroke="#1b6e2f" stroke-width="2"/>

  <path d="M280 250 C370 205 500 155 680 130" fill="none" stroke="#1b6e2f" stroke-width="4"/>
  <line x1="90" y1="250" x2="280" y2="250" stroke="#b22222" stroke-width="4" stroke-dasharray="10 7"/>
  <line x1="680" y1="130" x2="870" y2="130" stroke="#b22222" stroke-width="4" stroke-dasharray="10 7"/>

  <text x="185" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">REJECT</text>
  <text x="185" y="170" text-anchor="middle" font-family="sans-serif" font-size="14">lookup &lt; E_min</text>
  <text x="480" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">SUPPORTED</text>
  <text x="480" y="170" text-anchor="middle" font-family="sans-serif" font-size="14">log-log interpolation only</text>
  <text x="775" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">REJECT</text>
  <text x="775" y="170" text-anchor="middle" font-family="sans-serif" font-size="14">lookup &gt; E_max</text>

  <text x="185" y="285" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b22222">old: reused E_min value</text>
  <text x="775" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b22222">old: reused E_max value</text>
  <text x="280" y="345" text-anchor="middle" font-family="sans-serif" font-size="14">E_min</text>
  <text x="680" y="345" text-anchor="middle" font-family="sans-serif" font-size="14">E_max</text>
  <text x="480" y="382" text-anchor="middle" font-family="sans-serif" font-size="16">Proton-equivalent reference lookup energy [MeV]</text>
</svg>
