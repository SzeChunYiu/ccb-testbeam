[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccb-mc-validation"
version = "0.1.0"
description = "Monte Carlo validation framework for CCB HiBeam testbeam analysis"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
root = ["uproot>=5.6"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "jsonschema>=4.0",
    "ccb-mc-validation[root]",
]

[project.scripts]
ccb-mc-validation = "ccb_mc_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
