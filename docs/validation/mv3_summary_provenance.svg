<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">MV3 tracked-summary provenance contradiction</title>
  <desc id="desc">The ledger says exact counts and chi-square components are absent, while the tracked summary contains exact counts and reproduces chi-square over ndf.</desc>
  <rect width="1120" height="620" fill="white"/>
  <text x="40" y="45" font-family="sans-serif" font-size="26" font-weight="bold">MV3 claim provenance: rounded report versus tracked exact summary</text>
  <text x="40" y="76" font-family="sans-serif" font-size="15">Software/documentation validation — not detector data or accepted physics closure.</text>

  <rect x="40" y="110" width="480" height="210" fill="#f3f3f3" stroke="black"/>
  <text x="65" y="145" font-family="sans-serif" font-size="20" font-weight="bold">Current ledger narrative</text>
  <text x="65" y="182" font-family="sans-serif" font-size="16">“exact per-stave counts omitted”</text>
  <text x="65" y="215" font-family="sans-serif" font-size="16">“underlying χ² and ndf absent”</text>
  <text x="65" y="248" font-family="sans-serif" font-size="16">source_data left empty</text>
  <text x="65" y="286" font-family="monospace" font-size="17">χ²/ndf = 68269.4 (rounded label)</text>

  <rect x="600" y="110" width="480" height="210" fill="#ffffff" stroke="black" stroke-width="2"/>
  <text x="625" y="145" font-family="sans-serif" font-size="20" font-weight="bold">Tracked mv3_summary.json</text>
  <text x="625" y="182" font-family="monospace" font-size="15">MC B8 = 55619 / 249484</text>
  <text x="625" y="215" font-family="monospace" font-size="15">Data B8 = 7051 / 306745</text>
  <text x="625" y="248" font-family="monospace" font-size="15">χ² = 204808.2179684494; ndf = 3</text>
  <text x="625" y="286" font-family="monospace" font-size="15">χ²/ndf = 68269.40598948313</text>

  <line x1="520" y1="215" x2="600" y2="215" stroke="black" stroke-width="3"/>
  <polygon points="600,215 582,205 582,225" fill="black"/>
  <text x="530" y="197" font-family="sans-serif" font-size="13">contradicted by</text>

  <text x="40" y="370" font-family="sans-serif" font-size="21" font-weight="bold">Independent arithmetic check</text>
  <text x="40" y="407" font-family="monospace" font-size="16">Σ (dataᵢ − 306745·fᵢ_MC)² / (306745·fᵢ_MC) = 204808.2179684494</text>
  <text x="40" y="440" font-family="monospace" font-size="16">204808.2179684494 / (4 − 1) = 68269.40598948313</text>

  <rect x="40" y="480" width="1040" height="90" fill="#f7f7f7" stroke="black"/>
  <text x="65" y="515" font-family="sans-serif" font-size="18" font-weight="bold">Interpretation</text>
  <text x="65" y="547" font-family="sans-serif" font-size="15">The statistic is exactly reconstructable, but remains FLAWED because geometry, selection transfer, covariance, gain response, and systematics are unresolved.</text>
  <text x="40" y="603" font-family="sans-serif" font-size="13">Policy: TRACKED_MV3_SUMMARY_OVERRIDES_ROUNDED_REPORT_PROSE</text>
</svg>
