name: Thesis QA

on:
  push:
    paths:
      - "docs/academic_chapters/**"
      - "docs/claim_ledger.csv"
      - "docs/figure_registry.csv"
      - "WIKI.md"
      - "scripts/audit_*.py"
      - "scripts/check_*.py"
  pull_request:
    paths:
      - "docs/academic_chapters/**"
      - "docs/claim_ledger.csv"
      - "WIKI.md"

jobs:
  audit-superseded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Superseded-value scan
        run: python scripts/audit_claim_superseded.py

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Broken link check
        run: python scripts/broken_link_checker.py

  check-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Claim ledger completeness
        run: python scripts/check_claim_ledger_complete.py

  check-claim-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Claim source path validation
        run: python scripts/check_claim_links.py docs/claim_ledger.csv

  check-status-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Status label vocabulary check
        run: python scripts/check_status_labels.py docs/claim_ledger.csv

  check-numeric-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Numeric claims CI check
        run: python scripts/check_numeric_claims_have_ci.py docs/claim_ledger.csv

  check-rmax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rmax formula consistency check
        run: python scripts/check_rmax_formula.py
