<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">WIKI claim front-door consistency audit</title>
  <desc id="desc">Synthetic documentation audit diagram showing three classes of mismatch between WIKI text and the canonical claim ledger.</desc>
  <rect x="1" y="1" width="1098" height="618" fill="white" stroke="black" stroke-width="2"/>
  <text x="550" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold">WIKI front door versus canonical claim ledger</text>
  <text x="550" y="70" text-anchor="middle" font-family="sans-serif" font-size="15">Synthetic documentation/provenance evidence — not detector data</text>

  <rect x="55" y="115" width="430" height="380" fill="#f7f7f7" stroke="black" stroke-width="2"/>
  <text x="270" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Current WIKI</text>
  <text x="85" y="200" font-family="monospace" font-size="18">MV4 raw: PASS</text>
  <text x="85" y="250" font-family="monospace" font-size="18">τeff truth: data_only</text>
  <text x="85" y="300" font-family="monospace" font-size="18">Every number has uncertainty.</text>
  <line x1="80" y1="315" x2="445" y2="315" stroke="black" stroke-width="3"/>
  <text x="270" y="380" text-anchor="middle" font-family="sans-serif" font-size="18">8 machine-detected issues</text>
  <text x="270" y="415" text-anchor="middle" font-family="sans-serif" font-size="16">3 status vocabulary</text>
  <text x="270" y="445" text-anchor="middle" font-family="sans-serif" font-size="16">3 ledger status mismatches</text>
  <text x="270" y="475" text-anchor="middle" font-family="sans-serif" font-size="16">1 truth type + 1 uncertainty overclaim</text>

  <rect x="615" y="115" width="430" height="380" fill="#f7f7f7" stroke="black" stroke-width="2"/>
  <text x="830" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Canonical ledger</text>
  <text x="645" y="200" font-family="monospace" font-size="18">CL-007: VALIDATED</text>
  <text x="645" y="250" font-family="monospace" font-size="18">CL-011: data_mc_self_consistent</text>
  <text x="645" y="300" font-family="monospace" font-size="18">CI_MISSING_BLOCKING present</text>
  <text x="830" y="380" text-anchor="middle" font-family="sans-serif" font-size="18">Required policy</text>
  <text x="830" y="420" text-anchor="middle" font-family="monospace" font-size="15">WIKI_FRONT_DOOR_MUST_MATCH</text>
  <text x="830" y="445" text-anchor="middle" font-family="monospace" font-size="15">_CANONICAL_LEDGER</text>

  <line x1="485" y1="305" x2="615" y2="305" stroke="black" stroke-width="4"/>
  <polygon points="615,305 595,293 595,317" fill="black"/>
  <text x="550" y="285" text-anchor="middle" font-family="sans-serif" font-size="16">validate</text>

  <text x="550" y="550" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Acceptance: FLAWED until WIKI wording is reconciled and the complete-file audit returns VALIDATED</text>
  <text x="550" y="580" text-anchor="middle" font-family="sans-serif" font-size="15">Values were not recalculated; this diagram concerns public status, truth-type, and uncertainty provenance.</text>
</svg>
