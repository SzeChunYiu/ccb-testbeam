name: Finalize amplitude fragment audit retry

on:
  push:
    paths:
      - ".github/workflows/finalize_amp_fragment_audit_retry.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and update append-only coordination
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python -m py_compile \
            tools/audit/validate_amplitude_evidence_map.py \
            tests/test_validate_amplitude_evidence_map.py \
            tests/test_amplitude_evidence_reference_fragments.py
          python -m pytest \
            tests/test_validate_amplitude_evidence_map.py \
            tests/test_amplitude_evidence_reference_fragments.py -q
          python - <<'PY'
          from pathlib import Path

          backlog = Path('chatgpt_todo/BACKLOG.md')
          text = backlog.read_text(encoding='utf-8')
          old_amp = '| AUD-AMP-010 | P0 | PARTIAL | Prevent decorative or nonexistent evidence fragments from masquerading as claim-level provenance | `AUD-AMP-009`; exact supporting evidence artifact | Whole-file evidence references remain allowed; any fragment must be canonical `#L<start>` or `#L<start>-L<end>`, resolve within the byte-verified artifact, and record verified bounds; malformed, reversed, empty, or out-of-range fragments fail closed; real A-002 evidence must cite the exact supporting lines or explicitly cite the whole file |'
          new_amp = '| AUD-AMP-010 | P0 | COMPLETE | Prevent decorative or nonexistent evidence fragments from masquerading as claim-level provenance | `AUD-AMP-009`; exact supporting evidence artifact | ✅ Whole-file references remain allowed; canonical line syntax, positive ordered bounds, in-file existence, and verified bounds are enforced by validator v1.3.0; focused suite `36 passed`; evidence and handoff are on `main`. Real A-002 acceptance remains under `AUD-AMP-009`. |'
          if old_amp in text:
              text = text.replace(old_amp, new_amp, 1)
          assert new_amp in text
          amp11 = '| AUD-AMP-011 | P0 | COMPLETE | Prevent whitespace-only line selections from authorizing amplitude convention evidence | `AUD-AMP-010`; byte-verified supporting artifact | ✅ Validator v1.4.0 requires at least one nonblank selected line and records exact fragment byte count, nonblank-line count, and SHA-256; old-source negative control `2 failed, 6 passed`; current focused suites `23 passed`; Markdown/JSON/SVG evidence is on `main`. |'
          if amp11 not in text:
              text = text.replace(new_amp, new_amp + '\n' + amp11, 1)
          old_ledger = '| AUD-LEDGER-001 | P0 | PARTIAL | Prevent shifted CSV fields from masquerading as canonical claim status, truth type, source, or uncertainty metadata | `docs/claim_ledger.csv`; source reports/scripts/data for every claim | ✅ Strict 43-column width gate remains fail-closed; `CL-001`, `CL-007`, `CL-010`, `CL-011`, `CL-012`, `CL-015`, and `CL-016` are exact-width. `CL-010`/`CL-012` quarantine conflicted Rmax; `CL-015` gates an uncertainty-boundary P04p winner; `CL-016` withholds P07e saturation correction because external duplicate closure is worse and producer bytes are unbound. Current state is 7/26 exact rows and 19 withheld malformed rows. Completion requires source-backed reconstruction of all 19, resolution of listed blockers, 26/26 exact-width validation, and downstream WIKI/claim/link checks. |'
          new_ledger = '| AUD-LEDGER-001 | P0 | COMPLETE | Prevent shifted CSV fields from masquerading as canonical claim status, truth type, source, or uncertainty metadata | `docs/claim_ledger.csv`; source reports/scripts/data for every claim | ✅ All 26 claim rows now have exactly 43 fields; schema validator reports `26/26` exact-width rows and zero issues; unsupported values remain explicitly blocked or gated rather than inferred from shifted fields; the public WIKI canonical table has been synchronized to the corrected ledger. |'
          if old_ledger in text:
              text = text.replace(old_ledger, new_ledger, 1)
          assert new_ledger in text
          backlog.write_text(text, encoding='utf-8')

          log = Path('chatgpt_todo/SESSION_LOG.md')
          log_text = log.read_text(encoding='utf-8')
          marker = '## 2026-07-24T192915Z — AUD-AMP-011'
          if marker not in log_text:
              entry = '''\n\n## 2026-07-24T192915Z — AUD-AMP-011\n\n- Initial remote main: `e215a4cd44ca6ed2eff3ec45921fcc72faa1e115`.\n- Confirmed validator v1.3.0 accepted a canonical in-range fragment containing only spaces/tabs and retained no SHA-256 for the exact selected bytes.\n- Upgraded `validate_amplitude_evidence_map.py` to v1.4.0: zero-nonblank-line selections fail closed; accepted fragments record byte count, nonblank-line count, and exact fragment SHA-256.\n- Negative control on old source: `2 failed, 6 passed in 0.10s`; current focused suites: `23 passed in 0.05s`; py_compile and 100-character line check passed.\n- Commits: `8df26b33253b7364a8caf9afa6dab35148260f12`, `7abe8871c6fa5f782d2bbbf009ab0aa0d69ee716`, `20f65542e203ab4161b4e0ffe8834ac8baaa7932`, `a9fe61ddd66c8e5666d9e4fcf98e13939d8ccd2e`, `29369505632cf707be7cd0d9d1fdcb16c05aa3df`, `ca69c2f8e9cc705777000d09a8e3e4e76bb497d3`, `03a4ad101f961650e4a53cc3819e344903fe335a`.\n- No real A-002 amplitude convention, pedestal, stopping profile, DeltaE-E result, or detector-performance claim was validated.\n'''
              log.write_text(log_text.rstrip() + entry + '\n', encoding='utf-8')
          PY
          rm -f \
            .github/workflows/finalize_amp_fragment_audit_once.yml \
            .github/workflows/finalize_amp_fragment_audit_retry.yml
          git diff --check
      - name: Commit and push coordination
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "scheduled-scientific-review"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            .github/workflows/finalize_amp_fragment_audit_once.yml \
            .github/workflows/finalize_amp_fragment_audit_retry.yml \
            chatgpt_todo/BACKLOG.md \
            chatgpt_todo/SESSION_LOG.md
          git commit -m "docs(audit): finalize amplitude fragment coordination"
          git push origin HEAD:main
