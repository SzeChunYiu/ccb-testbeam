name: Raw PID notebook discovery

on:
  pull_request:
    paths:
      - ".github/workflows/raw_pid_notebook_discovery.yml"
      - "chatgpt_todo/raw_pid_20260907/**"

permissions:
  contents: read

jobs:
  discover-hf-and-raw-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated analysis dependencies
        run: python -m pip install --upgrade pip huggingface_hub pyarrow pandas
      - name: Discover Hugging Face dataset bytes and schema
        shell: bash
        run: |
          set -euo pipefail
          python chatgpt_todo/raw_pid_20260907/discover_hf_raw.py | tee "$RUNNER_TEMP/ccb_hf_discovery.log"
      - name: Upload discovery log
        uses: actions/upload-artifact@v4
        with:
          name: raw-pid-discovery
          path: ${{ runner.temp }}/ccb_hf_discovery.log
