name: Finalize MV4 ledger audit once

on:
  push:
    paths:
      - ".github/workflows/finalize_mv4_ledger_once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate exact repository state
        shell: bash
        run: |
          git pull --ff-only origin main
          python -m py_compile \
            tools/audit/audit_mv4_legacy_claim_rows.py \
            tests/test_audit_mv4_legacy_claim_rows.py \
            tools/audit/finalize_mv4_coordination_once.py
          PYTHONPATH=. python -m pytest \
            tests/test_audit_mv4_legacy_claim_rows.py -q | tee /tmp/pytest.txt
          PYTHONPATH=. python tools/audit/audit_mv4_legacy_claim_rows.py \
            --ledger docs/claim_ledger.csv \
            --report reports/mv4_timing_1782678162/REPORT.md \
            --summary reports/mv4_timing_1782678162/mv4_summary.json \
            --contract scripts/MV4_TIMING_README.md \
            --output-json /tmp/mv4.json \
            --output-svg /tmp/mv4.svg >/tmp/mv4.txt
          PYTHONPATH=. python tools/audit/validate_claim_ledger_schema.py \
            docs/claim_ledger.csv \
            --output /tmp/schema.json \
            --svg /tmp/schema.svg >/tmp/schema.txt
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          mv4 = json.loads(Path('/tmp/mv4.json').read_text())
          schema = json.loads(Path('/tmp/schema.json').read_text())
          assert mv4['status'] == 'VALIDATED' and mv4['n_issues'] == 0
          assert schema['status'] == 'VALIDATED'
          assert schema['exact_width_rows'] == 26
          assert schema['width_mismatch_rows'] == 0
          assert mv4 == json.loads(Path(
              'docs/validation/mv4_legacy_claim_rows_audit_validation.json'
          ).read_text())
          assert schema == json.loads(Path(
              'docs/validation/claim_ledger_schema_validation.json'
          ).read_text())
          ET.parse('/tmp/mv4.svg')
          ET.parse('/tmp/schema.svg')
          ET.parse('docs/validation/mv4_legacy_claim_rows_audit.svg')
          ET.parse('docs/validation/claim_ledger_schema.svg')
          PY
          git diff --check
      - name: Update, commit, and push coordination
        shell: bash
        run: |
          python tools/audit/finalize_mv4_coordination_once.py
          git diff --check
          git config user.name "scheduled-scientific-review"
          git config user.email "actions@users.noreply.github.com"
          git add chatgpt_todo
          git commit -m "docs(audit): complete MV4 ledger remediation handoff"
          FIRST_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main 2>&1 | tee /tmp/push1.txt
          python tools/audit/finalize_mv4_coordination_once.py \
            --confirm-sha "$FIRST_SHA" \
            --push-output-file /tmp/push1.txt
          rm .github/workflows/finalize_mv4_ledger_once.yml
          rm tools/audit/finalize_mv4_coordination_once.py
          git add chatgpt_todo/HANDOFF.md chatgpt_todo/SESSION_LOG.md \
            .github/workflows/finalize_mv4_ledger_once.yml \
            tools/audit/finalize_mv4_coordination_once.py
          git commit -m "ci(audit): confirm MV4 delivery and remove transport"
          git push origin HEAD:main
