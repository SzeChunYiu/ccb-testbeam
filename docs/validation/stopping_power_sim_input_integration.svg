<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Stopping-power simulation-input parser integration</title>
  <desc id="desc">Synthetic regression diagram contrasting the former silent row skip with the shared fail-closed parser.</desc>
  <rect width="1100" height="520" fill="white"/>
  <text x="550" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Canonical stopping-power CSV ingestion</text>
  <text x="550" y="66" text-anchor="middle" font-family="sans-serif" font-size="15">Synthetic regression evidence — not detector data</text>
  <rect x="55" y="105" width="440" height="315" rx="12" fill="#f5f5f5" stroke="#444" stroke-width="2"/>
  <text x="275" y="140" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Former separate reader</text>
  <text x="95" y="185" font-family="monospace" font-size="16">row 1: valid</text>
  <text x="95" y="225" font-family="monospace" font-size="16">row 2: missing energy</text>
  <text x="95" y="265" font-family="monospace" font-size="16">row 3: valid</text>
  <path d="M340 178 L420 178 M340 218 L420 218 M340 258 L420 258" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="185" text-anchor="end" font-family="sans-serif" font-size="15">kept</text>
  <text x="445" y="225" text-anchor="end" font-family="sans-serif" font-size="15">silently skipped</text>
  <text x="445" y="265" text-anchor="end" font-family="sans-serif" font-size="15">kept</text>
  <rect x="120" y="315" width="310" height="65" rx="8" fill="#fff" stroke="#444"/>
  <text x="275" y="342" text-anchor="middle" font-family="sans-serif" font-size="16">3 input rows → 2 aggregated rows</text>
  <text x="275" y="367" text-anchor="middle" font-family="sans-serif" font-size="16">no row-accounting failure</text>
  <rect x="605" y="105" width="440" height="315" rx="12" fill="#f5f5f5" stroke="#444" stroke-width="2"/>
  <text x="825" y="140" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Shared canonical validator</text>
  <text x="645" y="185" font-family="monospace" font-size="16">row 1: valid</text>
  <text x="645" y="225" font-family="monospace" font-size="16">row 2: missing energy</text>
  <text x="645" y="265" font-family="monospace" font-size="16">row 3: not processed</text>
  <rect x="665" y="315" width="320" height="65" rx="8" fill="#fff" stroke="#444"/>
  <text x="825" y="342" text-anchor="middle" font-family="sans-serif" font-size="16">status 2 input error at row 2</text>
  <text x="825" y="367" text-anchor="middle" font-family="sans-serif" font-size="16">no numerical PASS is printed</text>
  <text x="550" y="466" text-anchor="middle" font-family="sans-serif" font-size="16">Validated focused suite: 35 tests; exact input SHA-256, bytes, row count and validator version are propagated to output.</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker></defs>
</svg>
