<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
<title id="title">P07e saturation recovery evidence hierarchy</title>
<desc id="desc">Synthetic pseudo-saturation recovery appears strong, but held-out duplicate-channel data show worse ML charge closure than the raw waveform.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="30" font-family="sans-serif" font-size="20" font-weight="bold">P07e: synthetic recovery does not authorize real-data correction</text>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#555" stroke-width="2"/></pattern></defs>
<text x="20" y="54" font-family="sans-serif" font-size="13">Repository result artifact; res68 is the 68th percentile absolute fractional charge error.</text>
<text x="20" y="108" font-family="sans-serif" font-size="13">Pseudo-saturation ML</text>
<rect x="180" y="90" width="98.7" height="24" fill="#d9d9d9" stroke="black"/>
<text x="286.7" y="108" font-family="monospace" font-size="12">0.036691 — synthetic closure</text>
<text x="20" y="188" font-family="sans-serif" font-size="13">Observed raw duplicate</text>
<rect x="180" y="170" width="325.1" height="24" fill="#d9d9d9" stroke="black"/>
<text x="513.1" y="188" font-family="monospace" font-size="12">0.120794 — external data</text>
<text x="20" y="268" font-family="sans-serif" font-size="13">ML duplicate closure</text>
<rect x="180" y="250" width="474.6" height="24" fill="url(#hatch)" stroke="black"/>
<text x="662.6" y="268" font-family="monospace" font-size="12">0.176358 — external data — worse</text>
<line x1="180" y1="335" x2="740" y2="335" stroke="black"/>
<text x="460.0" y="365" text-anchor="middle" font-family="sans-serif" font-size="13">charge res68 absolute fractional error (lower is better)</text>
<text x="20" y="385" font-family="sans-serif" font-size="11">Visual evidence from committed P07e result.json; not a detector calibration and not a new data analysis.</text>
</svg>
